services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    # No public port: only Caddy reaches the backend over the internal network.
    expose:
      - "8100"
    env_file:
      - path: .env
        required: false
    environment:
      # Data paths inside the named volume
      DATABASE_URL: "sqlite:////data/deepnotes.db"
      CHROMA_DIR: "/data/chroma"
      TABLES_PATH: "/data/tables.duckdb"
      # Allow requests from any origin (single-user self-hosted app)
      CORS_ORIGINS: "*"
    volumes:
      # Persistent notebooks/sources/vectors — survives container restarts
      - deepnotes-data:/data
      # ML model cache (docling, faster-whisper) — avoids re-downloading on restart
      - model-cache:/root/.cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Call the backend same-origin via Caddy (/api → backend), so it works over HTTPS
        # with no hardcoded host/port and no mixed-content.
        NEXT_PUBLIC_API_URL: /api
    # No public port: only Caddy reaches the frontend over the internal network.
    expose:
      - "3100"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  deepnotes-data:
  model-cache:
  caddy-data:
  caddy-config:
